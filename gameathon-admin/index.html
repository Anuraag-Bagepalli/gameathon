<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameathon Admin Portal - Dashboard</title>
    <link rel="icon" type="image/png" href="logo.png">
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Chart.js for Dashboard Charts -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading dashboard...</p>
    </div>

    <!-- Application Layout -->
    <div class="app-layout" id="mainContainer" style="display: none;">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">GA</div>
                <div class="logo-text">
                    <h2>Gameathon</h2>
                    <p>Admin Portal</p>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item active">
                    <i class="fas fa-border-all"></i> Dashboard
                </a>
                <a href="applications.html" class="nav-item">
                    <i class="fas fa-clipboard-list"></i> Applications
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="https://github.com/Anuraag-Bagepalli/gameathon" target="_blank" class="nav-item">
                    <i class="fab fa-github"></i> Source Code
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="navbar-left">
                    <button class="mobile-menu-btn icon-btn" onclick="toggleMobileMenu()" aria-label="Menu">
                        <i class="fas fa-bars"></i>
                    </button>
                    <h2 class="page-title">Admin Portal</h2>
                </div>
                <div class="navbar-center">
                    <div class="search-bar" style="visibility: hidden;">
                        <i class="fas fa-search"></i>
                        <input type="text" placeholder="Search...">
                    </div>
                </div>
                <div class="navbar-right">
                    <button class="icon-btn theme-admin-btn" id="themeAdminBtn" onclick="toggleAdminTheme()" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                
                <!-- Page Header & Actions -->
                <div class="page-header">
                    <div class="page-header-text">
                        <h1>Dashboard Overview</h1>
                        <p>Welcome back. Here is your current event snapshot.</p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-primary" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
                    </div>
                </div>

                <!-- Statistics Row -->
                <div class="stats-row">
                    <div class="stat-card">
                        <div class="stat-title">TOTAL APPLICATIONS</div>
                        <div class="stat-value">
                            <span id="totalApps">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">APPROVED</div>
                        <div class="stat-value">
                            <span id="approvedApps">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">PENDING</div>
                        <div class="stat-value">
                            <span id="pendingApps">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">REJECTED</div>
                        <div class="stat-value">
                            <span id="rejectedApps" class="text-danger">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">UNIQUE UTR</div>
                        <div class="stat-value">
                            <span id="uniqueUTR">0</span>
                        </div>
                    </div>
                    <div class="stat-card">
                        <div class="stat-title">DUPLICATE UTR</div>
                        <div class="stat-value">
                            <span id="duplicateUTR">0</span>
                        </div>
                    </div>
                </div>

                <!-- Charts Row -->
                <div class="charts-row">
                    <div class="chart-container trend-chart-wrapper">
                        <div class="chart-header">
                            <h3>Registration Trend</h3>
                        </div>
                        <div class="chart-body">
                            <canvas id="trendChart"></canvas>
                        </div>
                    </div>
                    <div class="chart-container status-chart-wrapper">
                        <div class="chart-header">
                            <h3>Registration Status</h3>
                        </div>
                        <div class="chart-body">
                            <canvas id="statusChart"></canvas>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
