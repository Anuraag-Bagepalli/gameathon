<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gameathon Admin Portal - Applications</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Loading Spinner -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <p>Loading applications...</p>
    </div>

    <!-- Application Layout -->
    <div class="app-layout" id="mainContainer" style="display: none;">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon">GA</div>
                <div class="logo-text">
                    <h2>Gameathon</h2>
                    <p>Admin Portal</p>
                </div>
            </div>
            
            <nav class="sidebar-nav">
                <a href="index.html" class="nav-item">
                    <i class="fas fa-border-all"></i> Dashboard
                </a>
                <a href="applications.html" class="nav-item active">
                    <i class="fas fa-clipboard-list"></i> Applications
                </a>
            </nav>

            <div class="sidebar-footer">
                <a href="https://github.com/Anuraag-Bagepalli/gameathon" target="_blank" class="nav-item">
                    <i class="fab fa-github"></i> Source Code
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Top Navbar -->
            <header class="top-navbar">
                <div class="navbar-left">
                    <h2 class="page-title">Admin Portal</h2>
                </div>
                <div class="navbar-center">
                    <div class="search-bar">
                        <i class="fas fa-search"></i>
                        <input type="text" id="searchInput" placeholder="Search applications..." onkeyup="applyFilters()">
                    </div>
                </div>
                <div class="navbar-right">
                    <button class="icon-btn theme-admin-btn" id="themeAdminBtn" onclick="toggleAdminTheme()" aria-label="Toggle Theme"><i class="fas fa-moon"></i></button>
                </div>
            </header>

            <!-- Dashboard Content -->
            <div class="dashboard-content">
                
                <!-- Page Header & Actions -->
                <div class="page-header">
                    <div class="page-header-text">
                        <h1>Applications Management</h1>
                        <p>View, filter, and manage team registrations.</p>
                    </div>
                    <div class="page-header-actions">
                        <button class="btn btn-primary" onclick="refreshData()"><i class="fas fa-sync-alt"></i> Refresh Data</button>
                    </div>
                </div>

                <!-- Recent Registrations Table -->
                <div class="table-section">
                    <div class="table-header">
                        <h3>All Applications</h3>
                        <div class="table-filters">
                            <select id="statusFilter" onchange="applyFilters()">
                                <option value="all">All Status</option>
                                <option value="pending">Pending</option>
                                <option value="approved">Approved</option>
                                <option value="rejected">Rejected</option>
                            </select>
                            <select id="utrFilter" onchange="applyFilters()">
                                <option value="all">All UTR</option>
                                <option value="unique">Unique</option>
                                <option value="duplicate">Duplicate</option>
                                <option value="missing">Missing</option>
                            </select>
                        </div>
                    </div>
                    
                    <div class="table-responsive">
                        <table class="data-table">
                            <thead>
                                <tr>
                                    <th>TEAM / LEADER</th>
                                    <th>COLLEGE</th>
                                    <th>DATE</th>
                                    <th>STATUS</th>
                                    <th class="text-right">ACTION</th>
                                </tr>
                            </thead>
                            <tbody id="applicationsContainer">
                                <!-- Table rows rendered here -->
                            </tbody>
                        </table>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Slide-over Details Panel -->
    <div class="panel-overlay" id="panelOverlay" onclick="closeDetailsPanel()"></div>
    <div class="details-panel" id="detailsPanel">
        <div class="panel-header">
            <h3 id="panelTeamName">Team Details</h3>
            <button class="close-btn" onclick="closeDetailsPanel()"><i class="fas fa-times"></i></button>
        </div>
        <div class="panel-body" id="panelBody">
            <!-- Dynamic content populated here -->
        </div>
    </div>

    <!-- Edit Modal (Preserved functionality) -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2><i class="fas fa-edit"></i> Edit Application</h2>
                <button class="close-btn" onclick="closeEditModal()">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <form id="editForm">
                    <input type="hidden" id="editId">
                    
                    <div class="form-row">
                        <div class="form-group">
                            <label for="editTeamName">Team Name *</label>
                            <input type="text" id="editTeamName" required>
                        </div>
                        <div class="form-group">
                            <label for="editTeamLeader">Team Leader *</label>
                            <input type="text" id="editTeamLeader" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editEmail">Email *</label>
                            <input type="email" id="editEmail" required>
                        </div>
                        <div class="form-group">
                            <label for="editPhone">Phone *</label>
                            <input type="tel" id="editPhone" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editCollege">College *</label>
                            <input type="text" id="editCollege" required>
                        </div>
                        <div class="form-group">
                            <label for="editMemberCount">Member Count</label>
                            <input type="number" id="editMemberCount" min="1" required>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="form-group">
                            <label for="editParticipationType">Participation Type</label>
                            <input type="text" id="editParticipationType">
                        </div>
                        <div class="form-group">
                            <label for="editTrainingOption">Training Option</label>
                            <input type="text" id="editTrainingOption">
                        </div>
                    </div>

                    <div class="form-group">
                        <label for="editUTRNumber">UTR Number</label>
                        <input type="text" id="editUTRNumber" onblur="validateUTR(this.value)">
                        <div id="utrValidation" class="validation-message"></div>
                    </div>

                    <div class="form-group">
                        <label for="editTeamMembers">Team Members (comma separated)</label>
                        <textarea id="editTeamMembers" rows="3" placeholder="Member 1, Member 2, Member 3..."></textarea>
                    </div>

                    <div class="form-group">
                        <label for="editPaymentScreenshot">Payment Screenshot URL</label>
                        <input type="url" id="editPaymentScreenshot">
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditModal()">Cancel</button>
                <button class="btn btn-primary" onclick="saveEdit()">Save Changes</button>
            </div>
        </div>
    </div>

    <!-- Toast Notifications -->
    <div id="toastContainer"></div>

    <script src="script.js"></script>
</body>
</html>
